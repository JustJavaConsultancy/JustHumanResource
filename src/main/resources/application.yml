app:
  kpi:
    max-kpi-weight: ${MAX_KPI_WEIGHT:1.0}

payroll:
  payment:
    enable-transfer: ${ENABLE_TRANSFER:false}

fam:
  api:
    base-url: ${FAM_API_BASE_URL:}
    assets-path: ${FAM_ASSETS_PATH:/api/assets/requestable}
    bearer-token: ${FAM_API_BEARER_TOKEN:}
    timeout: ${FAM_API_TIMEOUT:5s}
    mode: ${FAM_MODE:SELF}

meeting:
  defaults:
    provider: ${MEETING_DEFAULT_PROVIDER:MICROSOFT_TEAMS}
    duration: ${MEETING_DEFAULT_DURATION:30m}
    timezone: ${MEETING_DEFAULT_TIMEZONE:Africa/Lagos}
    notify-participants: ${MEETING_NOTIFY_PARTICIPANTS:true}
    allow-instant-meeting: ${MEETING_ALLOW_INSTANT:true}
  notifications:
    system-sender-employee-id: ${MEETING_SYSTEM_SENDER_EMPLOYEE_ID:}
    send-chat-invites: ${MEETING_SEND_CHAT_INVITES:true}
    send-email-invites: ${MEETING_SEND_EMAIL_INVITES:true}
  providers:
    zoom:
      enabled: ${ZOOM_MEETING_ENABLED:false}
      account-id: ${ZOOM_ACCOUNT_ID:}
      client-id: ${ZOOM_CLIENT_ID:}
      client-secret: ${ZOOM_CLIENT_SECRET:}
      default-host-user-id: ${ZOOM_DEFAULT_HOST_USER_ID:me}
      token-url: ${ZOOM_TOKEN_URL:https://zoom.us/oauth/token}
      api-base-url: ${ZOOM_API_BASE_URL:https://api.zoom.us/v2}
    microsoft:
      enabled: ${MS_TEAMS_MEETING_ENABLED:false}
      tenant-id: ${MS_TENANT_ID:}
      client-id: ${MS_CLIENT_ID:}
      client-secret: ${MS_CLIENT_SECRET:}
      default-organizer-user-id: ${MS_DEFAULT_ORGANIZER_USER_ID:}
      graph-base-url: ${MS_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
    google:
      enabled: ${GOOGLE_MEET_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_MEET_REFRESH_TOKEN:}
      redirect-uri: ${GOOGLE_MEET_REDIRECT_URI:}
      default-organizer-email: ${GOOGLE_DEFAULT_ORGANIZER_EMAIL:}
      token-url: ${GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}
      meet-base-url: ${GOOGLE_MEET_BASE_URL:https://meet.googleapis.com/v2}


#resend
resend:
  api-key: ${RESEND_API_KEY:}
  default-from: ${RESEND_FROM:}
