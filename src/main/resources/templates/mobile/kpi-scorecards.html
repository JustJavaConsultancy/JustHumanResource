<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="layouts/mobileEmployeeLayout">
<head>
    <meta charset="UTF-8">
    <title>Balanced Scorecards</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body>
<main class="flex-1 overflow-y-auto px-5 pb-6 space-y-5" layout:fragment="content">
    <div class="flex items-center justify-between mt-2">
        <div>
            <h2 class="text-xl font-bold tracking-tight">Balanced Scorecards</h2>
            <p class="text-xs text-slate-500">
                <span th:text="${templates != null ? templates.size() : 0}">0</span> published templates
            </p>
        </div>
        <a href="/mobile/kpi" class="text-xs font-semibold text-blue-600">Back</a>
    </div>

    <section class="space-y-3">
        <div th:if="${#lists.isEmpty(templates)}"
             class="rounded-2xl border border-slate-200 bg-white p-5 text-sm text-slate-500">
            No published scorecard templates yet.
        </div>

        <article th:each="template : ${templates}"
                 class="rounded-2xl border border-slate-200 bg-white p-5 space-y-4">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <h3 class="font-bold text-slate-900" th:text="${template.name}">Template</h3>
                    <p class="text-xs text-slate-500" th:text="${template.roleName != null ? template.roleName : 'No role set'}">Role</p>
                    <p class="text-[11px] text-slate-400"
                       th:if="${template.sourceType != null}"
                       th:text="${template.sourceType == 'EXCEL_IMPORT' ? 'Imported by ' + (template.importedBy != null ? template.importedBy : 'system') : 'Manual template'}">Source</p>
                </div>
                <span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-700"
                      th:text="${template.totalWeight}">1.00</span>
            </div>

            <div class="space-y-2">
                <div th:each="item : ${itemsByTemplate.get(template.id)}"
                     class="flex items-center justify-between gap-3 border-t border-slate-100 pt-2 text-sm">
                    <div>
                        <p class="font-medium text-slate-800" th:text="${item.kpi.name}">KPI</p>
                        <p class="text-[0.65rem] text-slate-400" th:text="${item.kpi.code}">CODE</p>
                    </div>
                    <span class="text-xs font-bold text-slate-600" th:text="${item.weight}">0.00</span>
                </div>
            </div>
        </article>
    </section>

    <section class="rounded-2xl border border-slate-200 bg-white p-5">
        <h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Recent Applications</h3>
        <div th:if="${#lists.isEmpty(assignmentHistory)}" class="text-sm text-slate-500">No assignment history yet.</div>
        <div th:each="assignment : ${assignmentHistory}" class="border-t border-slate-100 py-3 first:border-t-0">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <p class="text-sm font-semibold" th:text="${assignment.templateName}">Template</p>
                    <p class="text-xs text-slate-500" th:text="${assignment.scope + ' - ' + assignment.ownerName}">Scope</p>
                </div>
                <span class="rounded-full px-2 py-1 text-[0.65rem] font-bold"
                      th:classappend="${assignment.active ? ' bg-emerald-50 text-emerald-700' : ' bg-slate-100 text-slate-500'}"
                      th:text="${assignment.active ? 'Active' : 'Inactive'}">Active</span>
            </div>
        </div>
    </section>
</main>
</body>
</html>
