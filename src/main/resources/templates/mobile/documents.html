<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
      layout:decorate="layouts/mobileEmployeeLayout">
<head>
    <meta charset="UTF-8">
    <title>Documents | JustHR Mobile</title>
    <style>
        .document-item {
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .dark .document-item {
            background-color: #1f2937;
            border-color: #374151;
        }

        .filter-chip {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .filter-chip.active {
            background-color: #2463eb;
            color: white;
        }

        .filter-chip:not(.active) {
            background-color: #f3f4f6;
            color: #6b7280;
        }

        .dark .filter-chip:not(.active) {
            background-color: #374151;
            color: #d1d5db;
        }
    </style>
</head>
<body>
<main layout:fragment="content" class="px-4 pb-6">
    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="flex size-10 items-center justify-center rounded-lg bg-primary/10">
                    <span class="material-symbols-outlined text-primary">folder</span>
                </div>
                <div>
                    <h3 class="font-bold text-slate-900 dark:text-white">Documents</h3>
                    <p id="documentSummary" class="text-xs text-slate-500 dark:text-slate-400">Loading documents...</p>
                </div>
            </div>
        </div>
    </section>

    <section class="mt-4">
        <label class="sr-only" for="documentSearch">Search documents</label>
        <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
            <input id="documentSearch"
                   class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-11 pr-4 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 dark:border-slate-700 dark:bg-slate-900"
                   placeholder="Search documents">
        </div>
    </section>

    <section class="mt-4 flex gap-2 overflow-x-auto pb-2 no-scrollbar" id="filterChips">
        <button class="filter-chip active" data-type="">All</button>
        <button class="filter-chip" data-type="application/pdf">PDF</button>
        <button class="filter-chip" data-type="image/">Images</button>
        <button class="filter-chip" data-type="text/">Text</button>
        <button class="filter-chip" data-type="application/msword">Word</button>
    </section>

    <section class="mt-3" id="documentsList">
        <div class="py-10 text-center text-sm text-slate-500">Loading documents...</div>
    </section>

    <script>
        let allDocuments = [];
        let activeType = '';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('documentSearch').addEventListener('input', renderDocuments);
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.filter-chip').forEach(item => item.classList.remove('active'));
                    chip.classList.add('active');
                    activeType = chip.dataset.type || '';
                    renderDocuments();
                });
            });
            loadDocuments();
        });

        function loadDocuments() {
            fetch('/api/documents/me')
                .then(response => {
                    if (!response.ok) throw new Error('Unable to load documents');
                    return response.json();
                })
                .then(documents => {
                    allDocuments = documents || [];
                    renderDocuments();
                })
                .catch(error => {
                    document.getElementById('documentSummary').textContent = 'Unable to load documents';
                    document.getElementById('documentsList').innerHTML =
                        `<div class="py-10 text-center text-sm text-red-600">${escapeHtml(error.message)}</div>`;
                });
        }

        function renderDocuments() {
            const query = document.getElementById('documentSearch').value.trim().toLowerCase();
            const documents = allDocuments.filter(document => {
                const type = (document.contentType || '').toLowerCase();
                const matchesType = !activeType || type.includes(activeType.toLowerCase());
                const haystack = [
                    document.displayName,
                    document.originalFileName,
                    document.contentType,
                    document.documentName,
                    document.uploadedBy
                ].filter(Boolean).join(' ').toLowerCase();
                return matchesType && (!query || haystack.includes(query));
            });

            document.getElementById('documentSummary').textContent =
                `${allDocuments.length} ${allDocuments.length === 1 ? 'document' : 'documents'}`;

            if (!documents.length) {
                document.getElementById('documentsList').innerHTML =
                    '<div class="py-10 text-center text-sm text-slate-500">No documents found.</div>';
                return;
            }

            document.getElementById('documentsList').innerHTML = documents.map(document => `
                <article class="document-item">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-2xl text-primary">${iconFor(document)}</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-semibold text-slate-900 dark:text-white">${escapeHtml(document.displayName || document.originalFileName || 'Document')}</p>
                            <p class="mt-1 truncate text-xs text-slate-500 dark:text-slate-400">
                                ${escapeHtml(document.originalFileName || '')} ${document.uploadedAt ? '&middot; ' + formatDate(document.uploadedAt) : ''}
                            </p>
                        </div>
                        <div class="flex gap-1">
                            <a href="${document.viewUrl}" target="_blank" class="flex size-9 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-primary dark:hover:bg-slate-800" aria-label="View document">
                                <span class="material-symbols-outlined text-xl">visibility</span>
                            </a>
                            <a href="${document.downloadUrl}" class="flex size-9 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-primary dark:hover:bg-slate-800" aria-label="Download document">
                                <span class="material-symbols-outlined text-xl">download</span>
                            </a>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function iconFor(document) {
            const type = (document.contentType || '').toLowerCase();
            if (type.includes('image')) return 'image';
            if (type.includes('pdf')) return 'picture_as_pdf';
            return 'description';
        }

        function formatDate(value) {
            const date = new Date(value);
            return isNaN(date) ? 'N/A' : date.toLocaleDateString();
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</main>
</body>
</html>
