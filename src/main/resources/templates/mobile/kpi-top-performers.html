<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/mobileEmployeeLayout}">
<head>
    <title>Top Performers</title>
    <style>
        .tp-card { background:#fff; border-radius:12px; border:1px solid #e5e7eb; padding:14px; margin-bottom:10px; }
        .tp-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f3f4f6; }
        .tp-row:last-child { border-bottom:none; }
        .tp-rank { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700; flex-shrink:0; }
        .tp-rank-1 { background:#fbbf24; color:#78350f; }
        .tp-rank-2 { background:#d1d5db; color:#374151; }
        .tp-rank-3 { background:#d97706; color:#fff; }
        .tp-rank-n { background:#f3f4f6; color:#6b7280; }
    </style>
</head>
<body>
<section layout:fragment="content">

    <a th:href="@{/mobile/kpi-report}" class="flex items-center gap-1 text-blue-600 text-sm mb-4">
        <span class="material-symbols-outlined" style="font-size:16px">arrow_back</span>Back to KPI Dashboard
    </a>

    <div class="bg-blue-900 rounded-xl p-4 mb-4 text-white">
        <p class="text-xs text-blue-300 uppercase font-semibold">Top Performers</p>
        <p class="text-sm text-blue-200 mt-1" th:text="${periodLabel}">Month Year</p>
    </div>

    <!-- By KPI Score -->
    <div class="tp-card mb-4">
        <p class="font-semibold text-sm mb-3">
            <span class="material-symbols-outlined text-blue-500 align-middle" style="font-size:18px">analytics</span>
            By KPI Score
        </p>
        <div th:if="${byKpi == null or #lists.isEmpty(byKpi)}" class="text-sm text-gray-400 text-center py-4">No data available.</div>
        <div th:each="p, pStat : ${byKpi}" class="tp-row"
             th:with="safeName=${p.employeeName != null ? p.employeeName : 'Unknown'}">
            <div class="tp-rank"
                 th:classappend="${pStat.index == 0} ? ' tp-rank-1' : (${pStat.index == 1} ? ' tp-rank-2' : (${pStat.index == 2} ? ' tp-rank-3' : ' tp-rank-n'))"
                 th:text="${p.rank != null ? '#' + p.rank : pStat.index + 1}">#1</div>
            <div class="flex-1 min-w-0">
                <p class="font-medium text-sm truncate" th:text="${safeName}">Name</p>
            </div>
            <span class="font-bold text-blue-700"
                  th:text="${p.score != null ? #numbers.formatDecimal(p.score,1,2) : '—'}">0.00</span>
        </div>
    </div>

    <!-- By Appraisal -->
    <div class="tp-card">
        <p class="font-semibold text-sm mb-3">
            <span class="material-symbols-outlined text-purple-500 align-middle" style="font-size:18px">rate_review</span>
            By Appraisal Score
        </p>
        <div th:if="${byAppraisal == null or #lists.isEmpty(byAppraisal)}" class="text-sm text-gray-400 text-center py-4">No data available.</div>
        <div th:each="p, pStat : ${byAppraisal}" class="tp-row"
             th:with="safeName=${p.employeeName != null ? p.employeeName : 'Unknown'}">
            <div class="tp-rank"
                 th:classappend="${pStat.index == 0} ? ' tp-rank-1' : (${pStat.index == 1} ? ' tp-rank-2' : (${pStat.index == 2} ? ' tp-rank-3' : ' tp-rank-n'))"
                 th:text="${p.rank != null ? '#' + p.rank : pStat.index + 1}">#1</div>
            <div class="flex-1 min-w-0">
                <p class="font-medium text-sm truncate" th:text="${safeName}">Name</p>
            </div>
            <span class="font-bold text-purple-700"
                  th:text="${p.score != null ? #numbers.formatDecimal(p.score,1,2) : '—'}">0.00</span>
        </div>
    </div>

</section>
</body>
</html>
