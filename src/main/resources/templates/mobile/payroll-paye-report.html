<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/mobileEmployeeLayout}">
<head>
    <title>PAYE Report</title>
    <style>
        .py-stat { background:#fff; border-radius:12px; border:1px solid #e5e7eb; padding:14px; }
        .py-card { background:#fff; border-radius:12px; border:1px solid #e5e7eb; padding:14px; margin-bottom:10px; }
        .py-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #f3f4f6; font-size:0.8rem; }
        .py-row:last-child { border-bottom:none; }
    </style>
</head>
<body>
<section layout:fragment="content">

    <div class="bg-blue-900 rounded-xl p-4 mb-4 text-white">
        <p class="text-xs text-blue-300 uppercase font-semibold">PAYE Tax Report</p>
        <p class="text-sm text-blue-200 mt-1" th:text="'Jan 1, ' + ${reportYear} + ' – Dec 31, ' + ${reportYear}">2026</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="py-stat">
            <p class="text-xs text-gray-500">Total Taxable Income</p>
            <p class="text-lg font-bold text-blue-900"
               th:text="'₦' + ${#numbers.formatDecimal(totalTaxableIncome,1,'COMMA',2,'POINT')}">₦0.00</p>
        </div>
        <div class="py-stat">
            <p class="text-xs text-gray-500">Total PAYE</p>
            <p class="text-lg font-bold text-red-600"
               th:text="'₦' + ${#numbers.formatDecimal(totalPaye,1,'COMMA',2,'POINT')}">₦0.00</p>
        </div>
        <div class="py-stat">
            <p class="text-xs text-gray-500">YTD PAYE</p>
            <p class="text-lg font-bold text-amber-600"
               th:text="'₦' + ${#numbers.formatDecimal(totalYtdPaye,1,'COMMA',2,'POINT')}">₦0.00</p>
        </div>
        <div class="py-stat">
            <p class="text-xs text-gray-500">Employees</p>
            <p class="text-lg font-bold text-blue-900" th:text="${totalRecords}">0</p>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${payeReport == null or #lists.isEmpty(payeReport)}" class="text-center py-12">
        <span class="material-symbols-outlined text-gray-300" style="font-size:48px">receipt_long</span>
        <p class="text-sm text-gray-500 mt-2">No PAYE records found.</p>
    </div>

    <!-- PAYE Cards -->
    <div th:each="paye, pStat : ${payeReport}" class="py-card"
         th:with="safeName=${paye.employeeName != null ? paye.employeeName : 'Unknown'}">
        <div class="flex items-start justify-between mb-2">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs"
                     th:text="${safeName.substring(0,1).toUpperCase()}">A</div>
                <div>
                    <p class="font-semibold text-sm" th:text="${safeName}">Name</p>
                    <p class="text-xs text-gray-400" th:text="'EMP-' + (paye.employeeId != null ? paye.employeeId : '???')">EMP-001</p>
                </div>
            </div>
            <span th:if="${paye.paye != null}" class="text-xs font-bold text-red-600"
                  th:text="'₦' + ${#numbers.formatDecimal(paye.paye,1,'COMMA',2,'POINT')}">₦0</span>
            <span th:if="${paye.paye == null}" class="text-xs text-gray-400">Pending</span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-xs text-center">
            <div class="bg-gray-50 rounded p-2">
                <p class="text-gray-400">Taxable</p>
                <p class="font-semibold"
                   th:text="${paye.taxableIncome != null ? '₦' + #numbers.formatDecimal(paye.taxableIncome,1,'COMMA',0,'POINT') : '—'}">—</p>
            </div>
            <div class="bg-red-50 rounded p-2">
                <p class="text-gray-400">PAYE</p>
                <p class="font-semibold text-red-600"
                   th:text="${paye.paye != null ? '₦' + #numbers.formatDecimal(paye.paye,1,'COMMA',0,'POINT') : '—'}">—</p>
            </div>
            <div class="bg-amber-50 rounded p-2">
                <p class="text-gray-400">YTD</p>
                <p class="font-semibold text-amber-600"
                   th:text="${paye.ytdPaye != null ? '₦' + #numbers.formatDecimal(paye.ytdPaye,1,'COMMA',0,'POINT') : '—'}">—</p>
            </div>
        </div>
    </div>

    <!-- Totals -->
    <div th:if="${payeReport != null and !#lists.isEmpty(payeReport)}"
         class="py-card" style="background:#eff6ff;">
        <p class="font-bold text-sm mb-2">Summary — <span th:text="${totalRecords}">0</span> employees</p>
        <div class="py-row">
            <span class="text-gray-500">Total Taxable Income</span>
            <span class="font-bold" th:text="'₦' + ${#numbers.formatDecimal(totalTaxableIncome,1,'COMMA',2,'POINT')}">₦0.00</span>
        </div>
        <div class="py-row">
            <span class="text-gray-500">Total PAYE</span>
            <span class="font-bold text-red-600" th:text="'₦' + ${#numbers.formatDecimal(totalPaye,1,'COMMA',2,'POINT')}">₦0.00</span>
        </div>
        <div class="py-row">
            <span class="text-gray-500">Total YTD PAYE</span>
            <span class="font-bold text-amber-600" th:text="'₦' + ${#numbers.formatDecimal(totalYtdPaye,1,'COMMA',2,'POINT')}">₦0.00</span>
        </div>
    </div>

</section>
</body>
</html>
