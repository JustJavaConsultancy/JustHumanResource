<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application received</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><style>*{font-family:Inter,sans-serif}</style></head><body class="bg-gray-50 min-h-screen flex items-center justify-center p-4"><main class="bg-white border border-gray-200 rounded-2xl p-8 max-w-lg w-full text-center shadow-sm"><div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 mx-auto flex items-center justify-center"><span class="material-icons-round text-3xl">task_alt</span></div><h1 class="text-2xl font-bold mt-5">Application received</h1><p class="text-gray-500 mt-3">Thank you for applying. Our recruitment team will review your information.</p><div class="mt-6 rounded-lg bg-gray-50 p-4"><p class="text-xs uppercase text-gray-400">Application reference</p><p class="font-mono font-bold mt-1" th:text="${result.applicationNumber}">APP</p></div><div class="mt-6 flex flex-col gap-3"><a th:href="@{/careers/applications/{token}(token=${result.accessToken})}" class="inline-block bg-blue-600 text-white rounded-lg py-3 font-semibold">Track application</a><a href="/careers" class="inline-block text-blue-600 font-medium">Return to open jobs</a></div></main></body></html>
