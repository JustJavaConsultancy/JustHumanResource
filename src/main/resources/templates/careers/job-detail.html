<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${job.jobTitle}+' - Careers'">Job</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:{600:'#2563eb',700:'#1d4ed8'}}}}}</script>
    <style>*{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-gray-50">
<header class="bg-white border-b">
    <div class="max-w-5xl mx-auto px-4 py-5">
        <a href="/careers" class="font-bold text-xl">JUST<span class="text-primary-600">HR</span> Careers</a>
    </div>
</header>
<main class="max-w-5xl mx-auto px-4 py-10">
    <a href="/careers" class="text-primary-600 text-sm">Back to all jobs</a>
    <div class="grid lg:grid-cols-5 gap-8 mt-5">
        <article class="lg:col-span-3 bg-white rounded-xl border border-gray-200 p-7">
            <h1 class="text-3xl font-bold" th:text="${job.jobTitle}">Job</h1>
            <p class="text-gray-500 mt-2" th:text="${(job.location ?: 'Location flexible')+' - '+job.employmentType}">Location</p>
            <section class="mt-8">
                <h2 class="font-bold text-lg">About the role</h2>
                <p class="mt-3 whitespace-pre-line text-gray-700" th:text="${job.description}">Description</p>
            </section>
            <section class="mt-8">
                <h2 class="font-bold text-lg">Responsibilities</h2>
                <p class="mt-3 whitespace-pre-line text-gray-700" th:text="${job.responsibilities}">Responsibilities</p>
            </section>
            <section class="mt-8">
                <h2 class="font-bold text-lg">Requirements</h2>
                <p class="mt-3 whitespace-pre-line text-gray-700" th:text="${job.requirements}">Requirements</p>
            </section>
        </article>
        <aside class="lg:col-span-2">
            <form method="post" th:action="@{/careers/jobs/{slug}/apply(slug=${job.publicSlug})}" th:object="${application}"
                  class="bg-white rounded-xl border border-gray-200 p-6 space-y-4 sticky top-4">
                <h2 class="font-bold text-xl">Apply now</h2>
                <div class="grid grid-cols-2 gap-3">
                    <input class="border rounded-lg p-3" th:field="*{firstName}" placeholder="First name" required>
                    <input class="border rounded-lg p-3" th:field="*{middleName}" placeholder="Middle name">
                </div>
                <input class="border rounded-lg p-3 w-full" th:field="*{lastName}" placeholder="Last name" required>
                <input class="border rounded-lg p-3 w-full" type="email" th:field="*{email}" placeholder="Email" required>
                <input class="border rounded-lg p-3 w-full" th:field="*{phone}" placeholder="Phone">
                <input class="border rounded-lg p-3 w-full" th:field="*{address}" placeholder="Address">
                <input class="border rounded-lg p-3 w-full" th:field="*{linkedInUrl}" placeholder="LinkedIn URL">
                <input class="border rounded-lg p-3 w-full" th:field="*{portfolioUrl}" placeholder="Portfolio URL">
                <select class="border rounded-lg p-3 w-full" th:field="*{source}">
                    <option value="">How did you hear about us?</option>
                    <option value="CAREERS_SITE">Careers site</option>
                    <option value="REFERRAL">Employee referral</option>
                    <option value="LINKEDIN">LinkedIn</option>
                    <option value="OTHER">Other</option>
                </select>
                <label class="flex gap-3 text-sm text-gray-600">
                    <input type="checkbox" th:field="*{consent}" required>
                    <span>I consent to the processing of my information for this application and recruitment purposes.</span>
                </label>
                <div th:if="${#fields.hasAnyErrors()}" class="rounded-lg bg-red-50 text-red-700 p-3 text-sm">
                    Please correct the highlighted application details.
                </div>
                <button class="w-full bg-primary-600 hover:bg-primary-700 text-white rounded-lg py-3 font-semibold">Submit application</button>
            </form>
        </aside>
    </div>
</main>
</body>
</html>
