<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Track your application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:{600:'#2563eb',700:'#1d4ed8'}}}}}</script>
    <style>*{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
<header class="bg-white border-b">
    <div class="max-w-5xl mx-auto px-4 py-5">
        <a href="/careers" class="font-bold text-xl">JUST<span class="text-primary-600">HR</span> Careers</a>
    </div>
</header>
<main class="max-w-md mx-auto px-4 py-10">
    <section class="bg-white rounded-xl border border-gray-200 p-7">
        <h1 class="text-xl font-bold">Track your application</h1>
        <p class="text-sm text-gray-500 mt-1">Enter your application number and email to view your application status and offers.</p>

        <div th:if="${error}" class="mt-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm" th:text="${error}">
            Error message
        </div>

        <form method="post" action="/careers/track" class="space-y-4 mt-6">
            <div>
                <label for="applicationNumber" class="block text-sm font-medium text-gray-700">Application number</label>
                <input type="text" id="applicationNumber" name="applicationNumber"
                       th:value="${applicationNumber}"
                       placeholder="e.g. APP-2026-00123"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600"
                       required>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                <input type="email" id="email" name="email"
                       th:value="${email}"
                       placeholder="The email you used to apply"
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600"
                       required>
            </div>
            <button type="submit" class="w-full px-4 py-2 bg-primary-600 text-white font-medium rounded-lg hover:bg-primary-700 transition-colors">
                View application
            </button>
        </form>
    </section>
</main>
</body>
</html>
