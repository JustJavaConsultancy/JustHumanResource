<!DOCTYPE html><html class="light" lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers · JUSTHR</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{primary:{600:'#2563eb',700:'#1d4ed8'}}}}}</script><style>*{font-family:Inter,sans-serif}</style></head><body class="bg-gray-50 text-gray-900 min-h-screen"><header class="bg-white border-b border-gray-200"><div class="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between"><a href="/careers" class="flex items-center gap-3"><span class="w-10 h-10 bg-primary-600 rounded-lg flex items-center justify-center"><span class="material-icons-round text-white">work</span></span><span class="text-xl font-bold">JUST<span class="text-primary-600">HR</span> Careers</span></a></div></header><main><section class="bg-gradient-to-r from-blue-700 to-indigo-700 text-white"><div class="max-w-6xl mx-auto px-4 py-16"><p class="text-blue-100 font-medium">Build your next chapter</p><h1 class="text-4xl md:text-5xl font-bold mt-3">Open opportunities</h1><p class="text-blue-100 mt-4 max-w-2xl">Explore current roles and submit your application securely.</p></div></section><section class="max-w-6xl mx-auto px-4 py-10"><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5"><a th:each="job:${jobs}" th:href="@{/careers/jobs/{slug}(slug=${job.publicSlug})}" class="bg-white rounded-xl border border-gray-200 p-6 hover:shadow-lg hover:-translate-y-0.5 transition"><div class="w-10 h-10 rounded-lg bg-blue-50 text-primary-600 flex items-center justify-center"><span class="material-icons-round">business_center</span></div><h2 class="text-lg font-bold mt-4" th:text="${job.jobTitle}">Job title</h2><div class="mt-3 flex gap-3 text-sm text-gray-500"><span th:text="${job.location ?: 'Location flexible'}">Location</span><span>·</span><span th:text="${job.employmentType}">Full time</span></div><p class="mt-5 text-primary-600 font-medium">View role →</p></a><div th:if="${#lists.isEmpty(jobs)}" class="md:col-span-2 xl:col-span-3 bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-500"><span class="material-icons-round text-5xl text-gray-300 block mb-3">work_off</span>No roles are currently open. Please check back soon.</div></div></section></main></body></html>
