<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Start Employee Exit</title></head><body><main layout:fragment="content" class="max-w-4xl mx-auto"><div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-6"><h2 class="text-xl font-bold">Start employee exit</h2><p class="text-gray-500 mb-6">Create a draft before submitting it for approval.</p><form method="post" action="/employee-exits" class="grid md:grid-cols-2 gap-5">
<label class="text-sm">Employee<select name="employeeId" class="form-input mt-1" required><option value="">Select employee</option><option th:each="e:${employees}" th:value="${e.id}" th:text="${e.employeeNumber + ' — ' + e.fullName}"></option></select></label>
<label class="text-sm">Exit type<select name="exitType" class="form-input mt-1" required><option th:each="t:${exitTypes}" th:value="${t}" th:text="${t}"></option></select></label>
<label class="text-sm">Reason code<input name="reasonCode" class="form-input mt-1" required></label><label class="text-sm">Notice date<input type="date" name="noticeDate" class="form-input mt-1" required></label>
<label class="text-sm">Proposed last working date<input type="date" name="proposedLastWorkingDate" class="form-input mt-1" required></label><label class="text-sm">Contractual notice days<input type="number" min="0" name="contractualNoticeDays" value="0" class="form-input mt-1"></label>
<label class="text-sm">Notice waived days<input type="number" min="0" name="noticeWaivedDays" value="0" class="form-input mt-1"></label><label class="text-sm md:col-span-2">Details<textarea name="reasonDetails" class="form-input mt-1" rows="4"></textarea></label><div class="md:col-span-2 flex justify-end"><button class="btn-primary">Create draft</button></div></form></div></main></body></html>
