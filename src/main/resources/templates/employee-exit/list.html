<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Employee Exits</title></head><body><main layout:fragment="content" class="space-y-6">
<div class="flex items-center justify-between"><div><h2 class="text-2xl font-bold">Employee Exits</h2><p class="text-gray-500">Clearance, settlement and access offboarding</p></div><a href="/employee-exits/new" class="btn-primary">Start exit</a></div>
<div class="grid md:grid-cols-3 gap-4"><div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-5"><p class="text-sm text-gray-500">All exit cases</p><p class="text-3xl font-bold" th:text="${#lists.size(exits)}">0</p></div><div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-5"><p class="text-sm text-gray-500">In clearance</p><p class="text-3xl font-bold text-amber-600" th:text="${pending}">0</p></div></div>
<div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50 dark:bg-gray-700 text-left"><tr><th class="p-4">Exit number</th><th>Employee ID</th><th>Type</th><th>Status</th><th>Effective date</th></tr></thead><tbody><tr th:each="x:${exits}" class="border-t border-gray-100 dark:border-gray-700"><td class="p-4"><a class="text-primary-600 font-medium" th:href="@{/employee-exits/{id}(id=${x.id})}" th:text="${x.exitNumber}">EXIT</a></td><td th:text="${x.employeeId}">1</td><td th:text="${x.exitType}">TYPE</td><td><span class="badge badge-info" th:text="${x.status}">STATUS</span></td><td th:text="${x.effectiveExitDate ?: x.proposedLastWorkingDate}">date</td></tr><tr th:if="${#lists.isEmpty(exits)}"><td colspan="5" class="p-8 text-center text-gray-500">No employee exits have been created.</td></tr></tbody></table></div>
</main></body></html>
