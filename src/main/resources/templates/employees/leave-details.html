<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/employeeLayout}">
<head>
    <meta charset="UTF-8">
    <title>Leave Request Details</title>
</head>
<body>
<main layout:fragment="content" class="space-y-6">
    <div>
        <a th:href="@{/employee/leave}" class="inline-flex items-center gap-1 text-sm font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400">
            <span class="material-icons-round text-base align-middle">arrow_back</span>
            Back to My Leaves
        </a>
    </div>

    <section id="leaveDetailsContainer" class="dashboard-card p-6">
        <p class="text-sm text-gray-500 dark:text-gray-400">Loading...</p>
    </section>

    <script th:inline="javascript">
        const leaveRequestId = /*[[${leaveRequestId}]]*/ 0;
    </script>
    <script>
        function badge(status) {
            const value = (status || '').toUpperCase();
            if (value === 'APPROVED') return '<span class="badge badge-success">Approved</span>';
            if (value === 'REJECTED') return '<span class="badge badge-error">Rejected</span>';
            if (value === 'IN_APPROVAL' || value === 'SUBMITTED') return '<span class="badge badge-warning">' + value.replace('_', ' ') + '</span>';
            return '<span class="badge badge-neutral">' + value.replace('_', ' ') + '</span>';
        }

        function formatDateTime(value) {
            return value ? String(value).replace('T', ' ') : '-';
        }

        function formatPerson(name, id) {
            return `${name || '-'}${id ? ' (ID: ' + id + ')' : ''}`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function fieldRow(label, id) {
            return `
                <div class="py-3">
                    <p class="text-xs font-medium uppercase text-gray-500 dark:text-gray-400">${label}</p>
                    <p id="${id}" class="mt-1 text-sm text-gray-900 dark:text-white"></p>
                </div>
            `;
        }

        function renderSkeleton() {
            const container = document.getElementById('leaveDetailsContainer');
            container.innerHTML = `
                <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">Leave Request Details</h3>
                <div class="divide-y divide-gray-200 dark:divide-gray-700">
                    ${fieldRow('Request', 'fieldRequest')}
                    ${fieldRow('Leave Type', 'fieldLeaveType')}
                    ${fieldRow('Period', 'fieldPeriod')}
                    ${fieldRow('Days', 'fieldDays')}
                    ${fieldRow('Requesting Employee', 'fieldRequester')}
                    ${fieldRow('Reason', 'fieldReason')}
                    ${fieldRow('Stand-in Colleague', 'fieldStandIn')}
                    ${fieldRow('Date Created', 'fieldCreatedAt')}
                    ${fieldRow('Status', 'fieldStatus')}
                    ${fieldRow('Approval Level', 'fieldApprovalLevel')}
                </div>
            `;
        }

        async function loadLeaveRequestDetails() {
            const container = document.getElementById('leaveDetailsContainer');
            container.innerHTML = '<p class="text-sm text-gray-500 dark:text-gray-400">Loading...</p>';
            try {
                const response = await fetch(`/leave/requests/${leaveRequestId}/details`);
                if (!response.ok) {
                    throw new Error(await response.text());
                }
                const data = await response.json();

                renderSkeleton();
                document.getElementById('fieldRequest').textContent = `Leave #${data.id ?? ''}`;
                document.getElementById('fieldLeaveType').textContent = data.leaveType || '-';
                document.getElementById('fieldPeriod').textContent = `${data.startDate || ''} to ${data.endDate || ''}`;
                document.getElementById('fieldDays').textContent = data.totalDays ?? '-';
                document.getElementById('fieldRequester').textContent = formatPerson(data.requesterName, data.requesterId);
                document.getElementById('fieldReason').textContent = data.reason || '-';
                document.getElementById('fieldStandIn').textContent = formatPerson(data.standInName, data.standInId);
                document.getElementById('fieldCreatedAt').textContent = formatDateTime(data.createdAt);
                document.getElementById('fieldStatus').innerHTML = badge(data.status);
                document.getElementById('fieldApprovalLevel').textContent = `${data.currentApprovalLevel || '-'} / ${data.totalApprovalLevels || '-'}`;
            } catch (e) {
                container.innerHTML = '<p class="text-sm text-red-600">' + escapeHtml(e.message) + '</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadLeaveRequestDetails);
    </script>
</main>
</body>
</html>
