<!DOCTYPE html><html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/employeeLayout}"><head><title>My Exit Request</title></head><body><main layout:fragment="content" class="space-y-6">
<div><h3 class="text-lg font-bold">My Exit Request</h3><p class="text-sm text-gray-500">Submit a resignation and follow its progress.</p></div><div class="grid lg:grid-cols-2 gap-6"><section class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6"><h4 class="font-bold mb-4">New resignation</h4><form method="post" action="/employee/exit" class="space-y-4"><input type="hidden" name="employeeId" th:value="${employee.id}"><input type="hidden" name="exitType" value="RESIGNATION"><label class="block text-sm">Reason<input name="reasonCode" value="PERSONAL" class="form-input mt-1" required></label><label class="block text-sm">Notice date<input type="date" name="noticeDate" class="form-input mt-1" required></label><label class="block text-sm">Proposed last working date<input type="date" name="proposedLastWorkingDate" class="form-input mt-1" required></label><label class="block text-sm">Details<textarea name="reasonDetails" class="form-input mt-1"></textarea></label><input type="hidden" name="contractualNoticeDays" value="0"><input type="hidden" name="noticeWaivedDays" value="0"><button class="btn-primary w-full">Create draft</button></form></section><section class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6"><h4 class="font-bold mb-4">Previous requests</h4><a th:each="x:${exits}" th:href="@{/employee/exit/{id}(id=${x.id})}" class="flex justify-between py-3 border-b"><span th:text="${x.exitNumber}"></span><span class="badge badge-info" th:text="${x.status}"></span></a><p th:if="${#lists.isEmpty(exits)}" class="text-sm text-gray-500">No exit requests.</p></section></div></main></body></html>
