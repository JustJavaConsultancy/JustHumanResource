<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Promotion Management'">Promotion Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#004ac6',
                        surface: '#f7f9fb',
                        'surface-container-lowest': '#ffffff',
                        'surface-container-low': '#f2f4f6',
                        'surface-container-high': '#e6e8ea',
                        'on-surface': '#191c1e',
                        'on-surface-variant': '#434655',
                        'outline-variant': '#c3c6d7',
                        error: '#ba1a1a'
                    },
                    fontFamily: {
                        headline: ['Manrope', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f7f9fb; }
        h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased">
<header class="sticky top-0 z-50 w-full bg-white/85 backdrop-blur-xl border-b border-outline-variant/20 shadow-sm h-16 flex justify-between items-center px-6 lg:px-10">
    <div class="flex items-center gap-6 lg:gap-10">
        <a th:href="@{/admin/users}" class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center shadow-md shadow-primary/20">
                <span class="material-symbols-outlined text-white text-2xl">shield</span>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight font-headline">JUST<span class="text-primary">HR</span></h1>
                <p class="text-[11px] font-medium text-gray-500 tracking-wide uppercase">Admin Console</p>
            </div>
        </a>
    </div>
    <div class="flex items-center gap-3">
        <a th:href="@{/admin/users}"
           class="px-4 py-2 rounded-xl text-sm font-semibold text-primary border border-outline-variant/30 bg-surface-container-lowest hover:bg-surface-container-high shadow-sm flex items-center gap-1.5">
            <span class="material-symbols-outlined text-lg">manage_accounts</span>
            User Manager
        </a>
        <a th:href="@{/employee-exits}"
           class="px-4 py-2 rounded-xl text-sm font-semibold text-primary border border-outline-variant/30 bg-surface-container-lowest hover:bg-surface-container-high shadow-sm flex items-center gap-1.5">
            <span class="material-symbols-outlined text-lg">logout</span>
            Employee Exits
        </a>
        <button id="logoutBtn" type="button" class="p-2 text-on-surface-variant hover:text-error rounded-full hover:bg-surface-container-high">
            <span class="material-symbols-outlined">logout</span>
        </button>
    </div>
</header>

<main class="w-full px-6 lg:px-10 py-8 lg:py-10 min-h-screen">
    <div class="mb-8">
        <h2 th:text="${title}" class="text-3xl lg:text-4xl font-extrabold font-headline tracking-tight text-on-surface">Promotion Management</h2>
        <p th:text="${subTitle}" class="text-on-surface-variant mt-1 text-base lg:text-lg font-medium">
            Manage employee promotions, approvals, and career progression
        </p>
    </div>
    <div layout:fragment="content"></div>
</main>

<div id="logoutModal" class="fixed inset-0 z-[200] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-on-surface/40 backdrop-blur-sm" onclick="closeLogoutModal()"></div>
    <div class="relative bg-surface-container-lowest rounded-2xl shadow-2xl max-w-md w-full mx-4 p-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold font-headline text-on-surface">Confirm Logout</h3>
            <button type="button" onclick="closeLogoutModal()" class="text-on-surface-variant hover:text-on-surface p-1 rounded-lg hover:bg-surface-container-high">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <p class="text-sm text-on-surface-variant mb-6 leading-relaxed">Are you sure you want to sign out?</p>
        <div class="flex justify-end gap-3">
            <button type="button" onclick="closeLogoutModal()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-on-surface-variant border border-outline-variant/30 bg-surface-container-lowest hover:bg-surface-container-high">Cancel</button>
            <button id="confirmLogoutBtn" type="button" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-error hover:bg-red-700 flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">logout</span>
                Sign Out
            </button>
        </div>
    </div>
</div>
<form id="logoutForm" th:action="@{/users/logout}" method="post" style="display:none"></form>

<script>
    const logoutBtn = document.getElementById('logoutBtn');
    const logoutModal = document.getElementById('logoutModal');
    const logoutForm = document.getElementById('logoutForm');
    logoutBtn?.addEventListener('click', () => {
        logoutModal?.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    });
    document.getElementById('confirmLogoutBtn')?.addEventListener('click', () => logoutForm?.submit());
    function closeLogoutModal() {
        logoutModal?.classList.add('hidden');
        document.body.style.overflow = '';
    }
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeLogoutModal();
    });
</script>
</body>
</html>
