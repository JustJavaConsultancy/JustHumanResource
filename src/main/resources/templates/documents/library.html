<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Document Library</title>
    <style>
        .doc-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: .5rem; }
        .dark .doc-panel { background: #1f2937; border-color: #374151; }
        .doc-control { border: 1px solid #d1d5db; border-radius: .5rem; padding: .65rem .75rem; background: #fff; width: 100%; }
        .dark .doc-control { background: #111827; border-color: #4b5563; color: #f9fafb; }
        .doc-btn { display: inline-flex; align-items: center; gap: .35rem; border-radius: .5rem; padding: .55rem .8rem; font-size: .875rem; font-weight: 600; }
        .doc-btn:disabled { opacity: .45; cursor: not-allowed; }
        .recipient-list { max-height: 260px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: .5rem; }
        .dark .recipient-list { border-color: #374151; }
    </style>
</head>
<body>
<main layout:fragment="content" class="space-y-5">
    <section class="doc-panel p-4">
        <form id="libraryUploadForm" class="grid grid-cols-1 gap-3 md:grid-cols-6">
            <div class="md:col-span-2">
                <label for="uploadOwner" class="mb-1 block text-xs font-semibold uppercase text-gray-500">Owner</label>
                <select id="uploadOwner" class="doc-control" required>
                    <option value="">Select employee</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label for="uploadDocumentName" class="mb-1 block text-xs font-semibold uppercase text-gray-500">Document Name</label>
                <input id="uploadDocumentName" class="doc-control" maxlength="160" placeholder="Contract, policy, certificate" required>
            </div>
            <div>
                <label for="uploadFile" class="mb-1 block text-xs font-semibold uppercase text-gray-500">File</label>
                <input id="uploadFile" type="file" class="doc-control" required>
            </div>
            <div class="flex items-end">
                <button id="libraryUploadBtn" class="doc-btn w-full justify-center bg-primary-600 text-white hover:bg-primary-700" type="submit">
                    <span class="material-icons-round text-base">cloud_upload</span>
                    Upload
                </button>
            </div>
            <p id="uploadStatus" class="md:col-span-6 text-sm text-gray-500">Upload a document into an employee's library.</p>
        </form>
    </section>

    <section class="doc-panel p-4">
        <div class="grid grid-cols-1 gap-3 md:grid-cols-6">
            <div class="md:col-span-2">
                <label for="docQuery" class="mb-1 block text-xs font-semibold uppercase text-gray-500">Search</label>
                <input id="docQuery" class="doc-control" placeholder="Name, employee, request, type">
            </div>
            <div>
                <label for="docSource" class="mb-1 block text-xs font-semibold uppercase text-gray-500">Source</label>
                <select id="docSource" class="doc-control">
                    <option value="">All sources</option>
                    <option value="EMPLOYEE_DOCUMENT">Employee documents</option>
                    <option value="REQUEST_ATTACHMENT">Request attachments</option>
                    <option value="DIRECT_CHAT_ATTACHMENT">Direct chat files</option>
                    <option value="GROUP_CHAT_ATTACHMENT">Group chat files</option>
                    <option value="BROADCAST_ATTACHMENT">Broadcast files</option>
                </select>
            </div>
            <div>
                <label for="docFrom" class="mb-1 block text-xs font-semibold uppercase text-gray-500">From</label>
                <input id="docFrom" type="date" class="doc-control">
            </div>
            <div>
                <label for="docTo" class="mb-1 block text-xs font-semibold uppercase text-gray-500">To</label>
                <input id="docTo" type="date" class="doc-control">
            </div>
            <div class="flex items-end">
                <button id="docSearchBtn" class="doc-btn w-full justify-center bg-primary-600 text-white hover:bg-primary-700">
                    <span class="material-icons-round text-base">search</span>
                    Search
                </button>
            </div>
        </div>
    </section>

    <section class="grid grid-cols-1 gap-4 md:grid-cols-3">
        <div class="doc-panel p-4">
            <p class="text-sm font-medium text-gray-500">Total Results</p>
            <p id="docTotal" class="mt-2 text-3xl font-bold">0</p>
        </div>
        <div class="doc-panel p-4">
            <p class="text-sm font-medium text-gray-500">Employee Documents</p>
            <p id="employeeDocTotal" class="mt-2 text-3xl font-bold">0</p>
        </div>
        <div class="doc-panel p-4">
            <p class="text-sm font-medium text-gray-500">Communication Files</p>
            <p id="communicationDocTotal" class="mt-2 text-3xl font-bold">0</p>
        </div>
    </section>

    <section class="doc-panel overflow-hidden">
        <div class="flex items-center justify-between border-b border-gray-200 px-4 py-3 dark:border-gray-700">
            <div class="flex flex-wrap items-center gap-3">
                <h3 class="text-sm font-semibold uppercase tracking-wide text-gray-600 dark:text-gray-300">Documents</h3>
                <span id="selectedCount" class="text-sm text-gray-500">0 selected</span>
                <button id="forwardSelectedBtn" class="doc-btn bg-primary-600 text-white hover:bg-primary-700" disabled>
                    <span class="material-icons-round text-base">forward_to_inbox</span>
                    Forward Selected
                </button>
                <button id="forwardAllBtn" class="doc-btn border border-gray-300 text-gray-700 dark:border-gray-600 dark:text-gray-200" disabled>
                    <span class="material-icons-round text-base">groups</span>
                    Send to All
                </button>
            </div>
            <div class="flex items-center gap-2">
                <button id="prevPage" class="doc-btn border border-gray-300 text-gray-700 disabled:opacity-40 dark:border-gray-600 dark:text-gray-200">
                    <span class="material-icons-round text-base">chevron_left</span>
                </button>
                <span id="pageLabel" class="text-sm text-gray-500">Page 1</span>
                <button id="nextPage" class="doc-btn border border-gray-300 text-gray-700 disabled:opacity-40 dark:border-gray-600 dark:text-gray-200">
                    <span class="material-icons-round text-base">chevron_right</span>
                </button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-xs uppercase text-gray-500 dark:bg-gray-900 dark:text-gray-400">
                <tr>
                    <th class="px-4 py-3 text-left">
                        <input id="selectAllDocs" type="checkbox" class="rounded border-gray-300">
                    </th>
                    <th class="px-4 py-3 text-left">Document</th>
                    <th class="px-4 py-3 text-left">Owner</th>
                    <th class="px-4 py-3 text-left">Source</th>
                    <th class="px-4 py-3 text-left">Uploaded</th>
                    <th class="px-4 py-3 text-right">Actions</th>
                </tr>
                </thead>
                <tbody id="docRows" class="divide-y divide-gray-100 dark:divide-gray-700">
                <tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Loading documents...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <div id="forwardModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900/50 p-4">
        <form id="forwardForm" class="w-full max-w-2xl rounded-lg border border-gray-200 bg-white shadow-xl dark:border-gray-700 dark:bg-gray-800">
            <div class="flex items-center justify-between border-b border-gray-200 p-4 dark:border-gray-700">
                <div>
                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">Forward Documents</h3>
                    <p id="forwardSummary" class="text-sm text-gray-500">0 documents selected.</p>
                </div>
                <button id="closeForwardModal" type="button" class="doc-btn border border-gray-300 text-gray-700 dark:border-gray-600 dark:text-gray-200">
                    <span class="material-icons-round text-base">close</span>
                </button>
            </div>
            <div class="space-y-4 p-4">
                <label class="inline-flex items-center gap-2 text-sm font-semibold">
                    <input id="forwardAllEmployees" type="checkbox" class="rounded border-gray-300">
                    Send to all active employees
                </label>
                <div id="recipientBlock">
                    <label for="recipientSearch" class="mb-1 block text-xs font-semibold uppercase text-gray-500">Recipients</label>
                    <input id="recipientSearch" class="doc-control mb-2" placeholder="Search employees">
                    <div id="recipientRows" class="recipient-list"></div>
                </div>
                <div>
                    <label for="forwardMessage" class="mb-1 block text-xs font-semibold uppercase text-gray-500">Message</label>
                    <textarea id="forwardMessage" class="doc-control min-h-[96px]" maxlength="2000" placeholder="Optional message"></textarea>
                </div>
                <p id="forwardStatus" class="text-sm text-gray-500">Choose recipients and send.</p>
            </div>
            <div class="flex justify-end gap-2 border-t border-gray-200 p-4 dark:border-gray-700">
                <button id="cancelForward" type="button" class="doc-btn border border-gray-300 text-gray-700 dark:border-gray-600 dark:text-gray-200">Cancel</button>
                <button id="sendForwardBtn" type="submit" class="doc-btn bg-primary-600 text-white hover:bg-primary-700">
                    <span class="material-icons-round text-base">send</span>
                    Send
                </button>
            </div>
        </form>
    </div>

    <script>
        let currentPage = 0;
        let totalPages = 0;
        const pageSize = 25;
        let currentDocuments = [];
        let employees = [];
        let selectedDocuments = new Map();

        document.addEventListener('DOMContentLoaded', () => {
            loadEmployees();
            document.getElementById('libraryUploadForm').addEventListener('submit', uploadLibraryDocument);
            document.getElementById('docSearchBtn').addEventListener('click', () => {
                currentPage = 0;
                loadDocuments();
            });
            document.getElementById('docQuery').addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    currentPage = 0;
                    loadDocuments();
                }
            });
            document.getElementById('prevPage').addEventListener('click', () => {
                if (currentPage > 0) {
                    currentPage--;
                    loadDocuments();
                }
            });
            document.getElementById('nextPage').addEventListener('click', () => {
                if (currentPage + 1 < totalPages) {
                    currentPage++;
                    loadDocuments();
                }
            });
            document.getElementById('selectAllDocs').addEventListener('change', toggleSelectAllDocuments);
            document.getElementById('forwardSelectedBtn').addEventListener('click', () => openForwardModal(false));
            document.getElementById('forwardAllBtn').addEventListener('click', () => openForwardModal(true));
            document.getElementById('closeForwardModal').addEventListener('click', closeForwardModal);
            document.getElementById('cancelForward').addEventListener('click', closeForwardModal);
            document.getElementById('forwardAllEmployees').addEventListener('change', renderRecipientMode);
            document.getElementById('recipientSearch').addEventListener('input', renderRecipients);
            document.getElementById('forwardForm').addEventListener('submit', forwardDocuments);
            loadDocuments();
        });

        function loadEmployees() {
            fetch('/api/documents/library/employees')
                .then(response => {
                    if (!response.ok) throw new Error('Unable to load employees');
                    return response.json();
                })
                .then(data => {
                    employees = data || [];
                    renderEmployeeOptions();
                    renderRecipients();
                })
                .catch(error => {
                    document.getElementById('uploadStatus').textContent = escapeHtml(error.message);
                });
        }

        function renderEmployeeOptions() {
            const options = employees.map(employee =>
                `<option value="${employee.id}">${escapeHtml(employee.fullName)} - ${escapeHtml(employee.department || 'Unassigned')}</option>`
            ).join('');
            document.getElementById('uploadOwner').innerHTML = '<option value="">Select employee</option>' + options;
        }

        function uploadLibraryDocument(event) {
            event.preventDefault();
            const file = document.getElementById('uploadFile').files[0];
            const form = new FormData();
            form.append('ownerEmployeeId', document.getElementById('uploadOwner').value);
            form.append('documentName', document.getElementById('uploadDocumentName').value.trim());
            form.append('file', file);
            document.getElementById('uploadStatus').textContent = 'Uploading...';
            fetch('/api/documents/library/upload', {method:'POST', body:form})
                .then(async response => {
                    if (!response.ok) throw new Error(await response.text() || 'Upload failed');
                    return response.json();
                })
                .then(() => {
                    event.target.reset();
                    document.getElementById('uploadStatus').textContent = 'Document uploaded.';
                    currentPage = 0;
                    loadDocuments();
                })
                .catch(error => {
                    document.getElementById('uploadStatus').textContent = 'Upload failed: ' + error.message;
                });
        }

        function loadDocuments() {
            const params = new URLSearchParams();
            params.set('page', currentPage);
            params.set('size', pageSize);
            addParam(params, 'query', document.getElementById('docQuery').value);
            addParam(params, 'sourceType', document.getElementById('docSource').value);
            addParam(params, 'uploadedFrom', document.getElementById('docFrom').value);
            addParam(params, 'uploadedTo', document.getElementById('docTo').value);

            const rows = document.getElementById('docRows');
            rows.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Loading documents...</td></tr>';

            fetch('/api/documents/library?' + params.toString())
                .then(response => {
                    if (!response.ok) throw new Error('Unable to load document library');
                    return response.json();
                })
                .then(renderDocuments)
                .catch(error => {
                    rows.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-red-600">${escapeHtml(error.message)}</td></tr>`;
                });
        }

        function renderDocuments(data) {
            totalPages = data.totalPages || 0;
            currentDocuments = data.documents || [];
            document.getElementById('docTotal').textContent = data.totalElements || 0;
            document.getElementById('employeeDocTotal').textContent = currentDocuments.filter(d => d.sourceType === 'EMPLOYEE_DOCUMENT').length;
            document.getElementById('communicationDocTotal').textContent = currentDocuments.filter(d => communicationSources().includes(d.sourceType)).length;
            document.getElementById('pageLabel').textContent = totalPages ? `Page ${currentPage + 1} of ${totalPages}` : 'Page 0';
            document.getElementById('prevPage').disabled = currentPage === 0;
            document.getElementById('nextPage').disabled = currentPage + 1 >= totalPages;

            const documents = currentDocuments;
            if (!documents.length) {
                document.getElementById('docRows').innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">No documents match the current filters.</td></tr>';
                updateSelectionState();
                return;
            }

            document.getElementById('docRows').innerHTML = documents.map(doc => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-800">
                    <td class="px-4 py-3">
                        <input type="checkbox" class="doc-checkbox rounded border-gray-300" data-doc-key="${documentKey(doc)}" ${selectedDocuments.has(documentKey(doc)) ? 'checked' : ''}>
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-3">
                            <span class="material-icons-round text-primary-600">${iconFor(doc)}</span>
                            <div class="min-w-0">
                                <p class="truncate font-semibold">${escapeHtml(doc.displayName || doc.originalFileName || 'Document')}</p>
                                <p class="truncate text-xs text-gray-500">${escapeHtml(doc.originalFileName || '')}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 py-3">
                        <p>${escapeHtml(doc.ownerEmployeeName || (doc.ownerEmployeeId ? 'Employee #' + doc.ownerEmployeeId : 'N/A'))}</p>
                        <p class="text-xs text-gray-500">${escapeHtml(doc.employeeNumber || '')}</p>
                    </td>
                    <td class="px-4 py-3">
                        <span class="badge badge-info">${escapeHtml(labelSource(doc.sourceType))}</span>
                        <p class="mt-1 text-xs text-gray-500">${escapeHtml(doc.requestNumber || doc.attachmentType || doc.contentType || '')}</p>
                    </td>
                    <td class="px-4 py-3">${formatDate(doc.uploadedAt)}</td>
                    <td class="px-4 py-3">
                        <div class="flex justify-end gap-2">
                            <a href="${doc.viewUrl}" target="_blank" class="doc-btn border border-gray-300 text-gray-700 dark:border-gray-600 dark:text-gray-200">
                                <span class="material-icons-round text-base">visibility</span>
                                View
                            </a>
                            <a href="${doc.downloadUrl}" class="doc-btn bg-primary-600 text-white hover:bg-primary-700">
                                <span class="material-icons-round text-base">download</span>
                                Download
                            </a>
                        </div>
                    </td>
                </tr>
            `).join('');
            document.querySelectorAll('.doc-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', () => toggleDocumentSelection(checkbox));
            });
            updateSelectionState();
        }

        function documentKey(doc) {
            return `${doc.sourceType}:${doc.id}`;
        }

        function toggleDocumentSelection(checkbox) {
            const doc = currentDocuments.find(item => documentKey(item) === checkbox.dataset.docKey);
            if (!doc) return;
            if (checkbox.checked) {
                selectedDocuments.set(documentKey(doc), doc);
            } else {
                selectedDocuments.delete(documentKey(doc));
            }
            updateSelectionState();
        }

        function toggleSelectAllDocuments(event) {
            currentDocuments.forEach(doc => {
                if (event.target.checked) {
                    selectedDocuments.set(documentKey(doc), doc);
                } else {
                    selectedDocuments.delete(documentKey(doc));
                }
            });
            document.querySelectorAll('.doc-checkbox').forEach(checkbox => checkbox.checked = event.target.checked);
            updateSelectionState();
        }

        function updateSelectionState() {
            const selectedCount = selectedDocuments.size;
            const visibleKeys = currentDocuments.map(documentKey);
            const visibleSelectedCount = visibleKeys.filter(key => selectedDocuments.has(key)).length;
            const allVisibleSelected = currentDocuments.length > 0 && visibleSelectedCount === currentDocuments.length;
            document.getElementById('selectedCount').textContent = `${selectedCount} selected`;
            document.getElementById('forwardSelectedBtn').disabled = selectedCount === 0;
            document.getElementById('forwardAllBtn').disabled = selectedCount === 0;
            document.getElementById('selectAllDocs').checked = allVisibleSelected;
        }

        function openForwardModal(allEmployees) {
            if (selectedDocuments.size === 0) return;
            document.getElementById('forwardSummary').textContent = `${selectedDocuments.size} document${selectedDocuments.size === 1 ? '' : 's'} selected.`;
            document.getElementById('forwardAllEmployees').checked = allEmployees;
            document.getElementById('forwardStatus').textContent = 'Choose recipients and send.';
            renderRecipientMode();
            document.getElementById('forwardModal').classList.remove('hidden');
            document.getElementById('forwardModal').classList.add('flex');
        }

        function closeForwardModal() {
            document.getElementById('forwardModal').classList.add('hidden');
            document.getElementById('forwardModal').classList.remove('flex');
            document.getElementById('forwardForm').reset();
            renderRecipientMode();
        }

        function renderRecipientMode() {
            document.getElementById('recipientBlock').classList.toggle('hidden', document.getElementById('forwardAllEmployees').checked);
        }

        function renderRecipients() {
            const rows = document.getElementById('recipientRows');
            if (!rows) return;
            const search = document.getElementById('recipientSearch').value.toLowerCase();
            const filtered = employees.filter(employee =>
                !search || employee.fullName.toLowerCase().includes(search) || (employee.department || '').toLowerCase().includes(search)
            );
            rows.innerHTML = filtered.length ? filtered.map(employee => `
                <label class="flex items-center gap-3 border-b border-gray-100 p-3 last:border-b-0 dark:border-gray-700">
                    <input type="checkbox" class="recipient-checkbox rounded border-gray-300" value="${employee.id}">
                    <span class="min-w-0">
                        <span class="block truncate text-sm font-semibold">${escapeHtml(employee.fullName)}</span>
                        <span class="block truncate text-xs text-gray-500">${escapeHtml(employee.department || 'Unassigned')} ${employee.employeeNumber ? '- ' + escapeHtml(employee.employeeNumber) : ''}</span>
                    </span>
                </label>
            `).join('') : '<div class="p-6 text-center text-sm text-gray-500">No employees found.</div>';
        }

        function forwardDocuments(event) {
            event.preventDefault();
            const allEmployees = document.getElementById('forwardAllEmployees').checked;
            const recipientEmployeeIds = [...document.querySelectorAll('.recipient-checkbox:checked')].map(input => Number(input.value));
            const documents = [...selectedDocuments.values()].map(doc => ({sourceType: doc.sourceType, id: doc.id}));
            if (!allEmployees && recipientEmployeeIds.length === 0) {
                document.getElementById('forwardStatus').textContent = 'Select at least one recipient.';
                return;
            }
            document.getElementById('forwardStatus').textContent = 'Sending...';
            fetch('/api/documents/library/forward', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    documents,
                    recipientEmployeeIds,
                    allEmployees,
                    message:document.getElementById('forwardMessage').value.trim()
                })
            })
                .then(async response => {
                    if (!response.ok) throw new Error(await response.text() || 'Forward failed');
                    return response.json();
                })
                .then(result => {
                    selectedDocuments.clear();
                    closeForwardModal();
                    loadDocuments();
                    document.getElementById('selectedCount').textContent = '0 selected';
                    alert(`Forwarded ${result.documentCount} document${result.documentCount === 1 ? '' : 's'} to ${result.recipientCount} employee${result.recipientCount === 1 ? '' : 's'}.`);
                })
                .catch(error => {
                    document.getElementById('forwardStatus').textContent = 'Forward failed: ' + error.message;
                });
        }

        function addParam(params, name, value) {
            if (value && value.trim()) params.set(name, value.trim());
        }

        function labelSource(source) {
            const labels = {
                EMPLOYEE_DOCUMENT: 'Employee',
                REQUEST_ATTACHMENT: 'Request',
                DIRECT_CHAT_ATTACHMENT: 'Direct Chat',
                GROUP_CHAT_ATTACHMENT: 'Group Chat',
                BROADCAST_ATTACHMENT: 'Broadcast'
            };
            return labels[source] || 'Document';
        }

        function communicationSources() {
            return ['DIRECT_CHAT_ATTACHMENT', 'GROUP_CHAT_ATTACHMENT', 'BROADCAST_ATTACHMENT'];
        }

        function iconFor(doc) {
            const type = (doc.contentType || '').toLowerCase();
            if (type.includes('image')) return 'image';
            if (type.includes('pdf')) return 'picture_as_pdf';
            return 'description';
        }

        function formatDate(value) {
            if (!value) return 'N/A';
            const date = new Date(value);
            return isNaN(date) ? 'N/A' : date.toLocaleDateString();
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</main>
</body>
</html>
