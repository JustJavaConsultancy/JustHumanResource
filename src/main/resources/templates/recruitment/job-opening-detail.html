<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Job Opening</title></head><body><main layout:fragment="content" class="space-y-6">
<div class="bg-gradient-to-r from-blue-700 to-indigo-700 rounded-2xl p-6 text-white"><div class="flex justify-between gap-4"><div><p class="text-blue-100 text-sm" th:text="'Staff requisition #'+${opening.staffRequisitionRequestId}">Requisition</p><h2 class="text-2xl font-bold mt-1" th:text="${opening.jobTitle}">Role</h2><p class="text-blue-100 mt-2" th:text="${opening.numberOfPositions}+' position(s)'">1</p></div><span class="h-fit px-3 py-1 rounded-full bg-white/15 text-sm" th:text="${opening.status}">DRAFT</span></div></div>
<form method="post" th:action="@{/recruitment/job-openings/{id}/prepare(id=${opening.id})}" class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 space-y-5">
 <h3 class="font-bold text-lg">Publication content</h3><div><label class="text-sm font-medium">Job description</label><textarea name="description" rows="5" class="form-input mt-1" required th:text="${opening.description}"></textarea></div>
 <div class="grid md:grid-cols-2 gap-5"><div><label class="text-sm font-medium">Responsibilities</label><textarea name="responsibilities" rows="6" class="form-input mt-1" required th:text="${opening.responsibilities}"></textarea></div><div><label class="text-sm font-medium">Requirements</label><textarea name="requirements" rows="6" class="form-input mt-1" required th:text="${opening.requirements}"></textarea></div></div>
 <div><label class="text-sm font-medium">Preferred qualifications</label><textarea name="preferredQualifications" rows="3" class="form-input mt-1" th:text="${opening.preferredQualifications}"></textarea></div>
 <div class="grid md:grid-cols-2 xl:grid-cols-4 gap-4"><input class="form-input" name="location" placeholder="Location" th:value="${opening.location}"><input class="form-input" name="workArrangement" placeholder="Work arrangement" th:value="${opening.workArrangement}"><input class="form-input" type="date" name="applicationOpenDate" th:value="${opening.applicationOpenDate}"><input class="form-input" type="date" name="applicationCloseDate" th:value="${opening.applicationCloseDate}"></div>
 <div class="flex justify-end"><button class="px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg font-medium">Save and send for review</button></div>
</form>
<form th:if="${activeTask != null and activeTask.taskDefinitionKey == 'reviewJobOpening'}" method="post" th:action="@{/recruitment/job-openings/{id}/review(id=${opening.id})}" class="bg-white dark:bg-gray-800 rounded-xl border border-amber-200 dark:border-amber-800 p-5 flex flex-wrap gap-3 items-center justify-between"><div><h3 class="font-bold">Hiring-manager review</h3><p class="text-sm text-gray-500">Approve publication, return the content, or cancel the opening.</p></div><div class="flex gap-2"><button name="publicationDecision" value="RETURN" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-lg">Return</button><button name="publicationDecision" value="CANCEL" class="px-4 py-2 bg-red-50 text-red-700 rounded-lg">Cancel</button><button name="publicationDecision" value="APPROVE" class="px-4 py-2 bg-emerald-600 text-white rounded-lg">Approve &amp; publish</button></div></form>
<form th:if="${opening.status.name() == 'PUBLISHED' or opening.status.name() == 'PAUSED'}" method="post" th:action="@{/recruitment/job-openings/{id}/close(id=${opening.id})}" class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 flex flex-wrap gap-3 items-center justify-between"><div><h3 class="font-bold">Close opening</h3><p class="text-sm text-gray-500">Stop accepting applications and complete the job-opening workflow.</p></div><button class="px-4 py-2 bg-red-50 text-red-700 rounded-lg">Close opening</button></form>
<section class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5"><h3 class="font-bold">Applications <span class="text-gray-400" th:text="'('+${#lists.size(applications)}+')'">(0)</span></h3></section>
</main></body></html>
