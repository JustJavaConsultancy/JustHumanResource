<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Applications</title></head><body><main layout:fragment="content"><section class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden"><div class="p-5 border-b border-gray-200 dark:border-gray-700"><h3 class="font-bold">Candidate pipeline</h3></div><div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50 dark:bg-gray-700 text-xs uppercase text-gray-500"><tr><th class="p-4 text-left">Application</th><th class="p-4 text-left">Submitted</th><th class="p-4 text-left">Stage</th><th class="p-4 text-left">Status</th><th></th></tr></thead><tbody class="divide-y divide-gray-100 dark:divide-gray-700"><tr th:each="a:${applications}"><td class="p-4 font-medium" th:text="${a.applicationNumber}">APP</td><td class="p-4 text-gray-500" th:text="${a.submittedAt}">Date</td><td class="p-4" th:text="${a.currentStage}">SCREENING</td><td class="p-4"><span class="badge badge-info" th:text="${a.status}">SUBMITTED</span></td><td class="p-4"><a class="text-primary-600" th:href="@{/recruitment/applications/{id}(id=${a.id})}">Review</a></td></tr></tbody></table></div></section></main></body></html>
