<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Recruitment · JUSTHR</title></head><body><main layout:fragment="content" class="space-y-6">
<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5"><span class="material-icons-round text-blue-600">work</span><p class="mt-3 text-2xl font-bold" th:text="${openJobs}">0</p><p class="text-sm text-gray-500">Published jobs</p></div>
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5"><span class="material-icons-round text-amber-600">inbox</span><p class="mt-3 text-2xl font-bold" th:text="${newApplications}">0</p><p class="text-sm text-gray-500">New applications</p></div>
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5"><span class="material-icons-round text-purple-600">groups</span><p class="mt-3 text-2xl font-bold" th:text="${interviewApplications}">0</p><p class="text-sm text-gray-500">At interview</p></div>
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5"><span class="material-icons-round text-emerald-600">handshake</span><p class="mt-3 text-2xl font-bold" th:text="${acceptedOffers}">0</p><p class="text-sm text-gray-500">Accepted offers</p></div>
</div>
<div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
 <section class="xl:col-span-2 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
  <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex justify-between"><h3 class="font-bold">Recent applications</h3><a th:href="@{/recruitment/applications}" class="text-sm text-primary-600">View all</a></div>
  <div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50 dark:bg-gray-700 text-xs uppercase text-gray-500"><tr><th class="p-3 text-left">Application</th><th class="p-3 text-left">Stage</th><th class="p-3 text-left">Status</th></tr></thead><tbody class="divide-y divide-gray-100 dark:divide-gray-700"><tr th:each="a:${applications}" class="hover:bg-gray-50 dark:hover:bg-gray-700/50"><td class="p-3"><a class="text-primary-600 font-medium" th:href="@{/recruitment/applications/{id}(id=${a.id})}" th:text="${a.applicationNumber}">APP</a></td><td class="p-3" th:text="${a.currentStage}">SCREENING</td><td class="p-3"><span class="badge badge-info" th:text="${a.status}">SUBMITTED</span></td></tr><tr th:if="${#lists.isEmpty(applications)}"><td colspan="3" class="p-10 text-center text-gray-400"><span class="material-icons-round text-4xl block">inbox</span>No applications yet</td></tr></tbody></table></div>
 </section>
 <section class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700">
  <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex justify-between"><h3 class="font-bold">Job openings</h3><a th:href="@{/recruitment/job-openings}" class="text-sm text-primary-600">View all</a></div>
  <div class="divide-y divide-gray-100 dark:divide-gray-700"><a th:each="j:${openings}" th:href="@{/recruitment/job-openings/{id}(id=${j.id})}" class="block p-4 hover:bg-gray-50 dark:hover:bg-gray-700/50"><p class="font-semibold" th:text="${j.jobTitle}">Role</p><div class="flex justify-between mt-1 text-xs text-gray-500"><span th:text="${j.numberOfPositions}+' position(s)'">1</span><span th:text="${j.status}">DRAFT</span></div></a><div th:if="${#lists.isEmpty(openings)}" class="p-10 text-center text-gray-400">No openings yet</div></div>
 </section>
</div></main></body></html>
