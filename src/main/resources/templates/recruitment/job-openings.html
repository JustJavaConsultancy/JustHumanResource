<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Job Openings</title></head><body><main layout:fragment="content"><section class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden"><div class="p-5 border-b border-gray-200 dark:border-gray-700"><h3 class="font-bold">Job openings from approved requisitions</h3><p class="text-sm text-gray-500 mt-1">Draft openings are created automatically after staff-requisition approval.</p></div><div class="overflow-x-auto"><table class="w-full min-w-[760px]"><thead class="bg-gray-50 dark:bg-gray-700 text-xs uppercase text-gray-500"><tr><th class="p-4 text-left">Role</th><th class="p-4 text-left">Positions</th><th class="p-4 text-left">Target start</th><th class="p-4 text-left">Status</th><th class="p-4"></th></tr></thead><tbody class="divide-y divide-gray-100 dark:divide-gray-700"><tr th:each="j:${openings}"><td class="p-4 font-semibold" th:text="${j.jobTitle}">Role</td><td class="p-4" th:text="${j.positionsFilled + ' / ' + j.numberOfPositions}">0/1</td><td class="p-4" th:text="${j.targetStartDate ?: '—'}">—</td><td class="p-4"><span class="badge badge-info" th:text="${j.status}">DRAFT</span></td><td class="p-4 text-right"><a class="text-primary-600 font-medium" th:href="@{/recruitment/job-openings/{id}(id=${j.id})}">Open</a></td></tr><tr th:if="${#lists.isEmpty(openings)}"><td colspan="5" class="p-12 text-center text-gray-400">No approved staff requisitions have created openings yet.</td></tr></tbody></table></div></section></main></body></html>
