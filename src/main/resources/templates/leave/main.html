<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Leave Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<main layout:fragment="content" class="space-y-6">

    <div>
        <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100">Leave Management</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Submit leave requests and process sequential line-manager approvals.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <section class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl">
            <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <h2 class="text-base font-semibold text-gray-900 dark:text-gray-100">All Leave Requests</h2>
                <button onclick="loadMyLeaveRequests()"
                        class="text-xs px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700">
                    Refresh
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                    <tr>
                        <th class="text-left px-4 py-3">Request</th>
                        <th class="text-left px-4 py-3">Type</th>
                        <th class="text-left px-4 py-3">Period</th>
                        <th class="text-left px-4 py-3">Days</th>
                        <th class="text-left px-4 py-3">Status</th>
                        <th class="text-left px-4 py-3">Details</th>
                    </tr>
                    </thead>
                    <tbody id="myLeaveRequestsBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
                </table>
            </div>
        </section>

        <section class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl">
            <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <h2 class="text-base font-semibold text-gray-900 dark:text-gray-100">Pending Approvals</h2>
                <button onclick="loadPendingApprovals()"
                        class="text-xs px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700">
                    Refresh
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                    <tr>
                        <th class="text-left px-4 py-3">Request</th>
                        <th class="text-left px-4 py-3">Task</th>
                        <th class="text-left px-4 py-3">Created</th>
                    </tr>
                    </thead>
                    <tbody id="pendingApprovalsBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
                </table>
            </div>
        </section>
    </div>

    <section class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl">
        <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <h2 class="text-base font-semibold text-gray-900 dark:text-gray-100">Public Holidays</h2>
            <button onclick="loadPublicHolidays()"
                    class="text-xs px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700">
                Refresh
            </button>
        </div>
        <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700 flex flex-wrap items-end gap-3">
            <div>
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Date</label>
                <input type="date" id="newHolidayDate"
                       class="text-sm border border-gray-300 dark:border-gray-600 rounded-md px-2 py-1.5 bg-white dark:bg-gray-900">
            </div>
            <div>
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Name</label>
                <input type="text" id="newHolidayName" placeholder="e.g. Independence Day"
                       class="w-72 text-sm border border-gray-300 dark:border-gray-600 rounded-md px-2 py-1.5 bg-white dark:bg-gray-900">
            </div>
            <button onclick="addPublicHoliday()"
                    class="text-xs px-3 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                Add Holiday
            </button>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th class="text-left px-4 py-3">Date</th>
                    <th class="text-left px-4 py-3">Name</th>
                    <th class="text-left px-4 py-3">Remove</th>
                </tr>
                </thead>
                <tbody id="publicHolidaysBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
            </table>
        </div>
    </section>

    <div id="deleteHolidayModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg w-full max-w-xs p-5">
            <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-2">Remove holiday?</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">This will permanently remove this public holiday.</p>
            <div class="flex justify-end gap-2">
                <button onclick="closeDeleteHolidayModal()"
                        class="text-xs px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700">
                    Cancel
                </button>
                <button onclick="confirmDeleteHoliday()"
                        class="text-xs px-3 py-1.5 bg-red-600 text-white rounded-md hover:bg-red-700">
                    Remove
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function statusBadge(status) {
            const s = (status || '').toUpperCase();
            if (s === 'APPROVED') return '<span class="px-2 py-1 rounded text-xs bg-green-100 text-green-700">APPROVED</span>';
            if (s === 'REJECTED') return '<span class="px-2 py-1 rounded text-xs bg-red-100 text-red-700">REJECTED</span>';
            if (s === 'IN_APPROVAL' || s === 'SUBMITTED') return '<span class="px-2 py-1 rounded text-xs bg-yellow-100 text-yellow-700">' + s + '</span>';
            return '<span class="px-2 py-1 rounded text-xs bg-gray-100 text-gray-700">' + s + '</span>';
        }

        async function fetchJsonSafe(url) {
            const res = await fetch(url);
            const contentType = (res.headers.get('content-type') || '').toLowerCase();
            if (!res.ok) {
                const text = await res.text();
                throw new Error(text || ('Request failed with status ' + res.status));
            }
            if (!contentType.includes('application/json')) {
                const text = await res.text();
                throw new Error('Expected JSON but received HTML/other response');
            }
            return res.json();
        }

        async function loadMyLeaveRequests() {
            const body = document.getElementById('myLeaveRequestsBody');
            body.innerHTML = '<tr><td colspan="6" class="px-4 py-4 text-sm text-gray-500">Loading...</td></tr>';
            try {
                const data = await fetchJsonSafe('/leave/requests/me');
                if (!data.length) {
                    body.innerHTML = '<tr><td colspan="6" class="px-4 py-4 text-sm text-gray-500">No leave requests found.</td></tr>';
                    return;
                }
                body.innerHTML = data.map(r => `
                    <tr>
                        <td class="px-4 py-3 font-medium">Leave #${r.id ?? ''}</td>
                        <td class="px-4 py-3">${r.leaveType || ''}</td>
                        <td class="px-4 py-3">${r.startDate || ''} to ${r.endDate || ''}</td>
                        <td class="px-4 py-3">${r.totalDays || ''}</td>
                        <td class="px-4 py-3">${statusBadge(r.status)}</td>
                        <td class="px-4 py-3">
                            <a href="/leave/details/${r.id}" class="text-primary-600 hover:text-primary-700" title="View details">
                                <span class="material-icons-round text-base align-middle">visibility</span>
                            </a>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                body.innerHTML = '<tr><td colspan="6" class="px-4 py-4 text-sm text-red-600">' + e.message + '</td></tr>';
            }
        }

        async function loadPendingApprovals() {
            const body = document.getElementById('pendingApprovalsBody');
            body.innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-sm text-gray-500">Loading...</td></tr>';
            try {
                const data = await fetchJsonSafe('/leave/approvals/tasks');
                if (!data.length) {
                    body.innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-sm text-gray-500">No pending approval tasks.</td></tr>';
                    return;
                }
                body.innerHTML = data.map(t => {
                    const leaveRequestId = (t.variables && t.variables.leaveRequestId) ? t.variables.leaveRequestId : '-';
                    return `
                        <tr>
                            <td class="px-4 py-3">Leave #${leaveRequestId}</td>
                            <td class="px-4 py-3">${t.taskName || t.taskDefinitionKey || ''}</td>
                            <td class="px-4 py-3">${(t.createdTime || '').replace('T', ' ')}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                body.innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-sm text-red-600">' + e.message + '</td></tr>';
            }
        }

        async function loadPublicHolidays() {
            const body = document.getElementById('publicHolidaysBody');
            body.innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-sm text-gray-500">Loading...</td></tr>';
            try {
                const data = await fetchJsonSafe('/leave/holidays');
                if (!data.length) {
                    body.innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-sm text-gray-500">No public holidays defined.</td></tr>';
                    return;
                }
                body.innerHTML = data.map(h => `
                    <tr>
                        <td class="px-4 py-3">
                            <div>${formatHolidayDateShort(h.date)}</div>
                            <div class="text-xs text-gray-500 dark:text-gray-400">${formatHolidayDate(h.date)}</div>
                        </td>
                        <td class="px-4 py-3">${h.name || ''}</td>
                        <td class="px-4 py-3">
                            <button onclick="deletePublicHoliday(${h.id})" class="text-red-600 hover:text-red-700" title="Remove">
                                <span class="material-icons-round text-base align-middle">delete</span>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                body.innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-sm text-red-600">' + e.message + '</td></tr>';
            }
        }

        async function addPublicHoliday() {
            const dateInput = document.getElementById('newHolidayDate');
            const nameInput = document.getElementById('newHolidayName');
            const date = dateInput.value;
            const name = nameInput.value.trim();
            if (!date || !name) {
                alert('Please provide both a date and a name.');
                return;
            }
            try {
                const res = await fetch('/leave/holidays', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, name })
                });
                if (!res.ok) {
                    throw new Error(await res.text() || 'Failed to add holiday.');
                }
                dateInput.value = '';
                nameInput.value = '';
                await loadPublicHolidays();
            } catch (e) {
                alert(e.message);
            }
        }

        function ordinalSuffix(n) {
            const j = n % 10, k = n % 100;
            if (j === 1 && k !== 11) return 'st';
            if (j === 2 && k !== 12) return 'nd';
            if (j === 3 && k !== 13) return 'rd';
            return 'th';
        }

        function formatHolidayDateShort(value) {
            if (!value) return '';
            const [year, month, day] = value.split('-');
            return `${day}-${month}-${year}`;
        }

        function formatHolidayDate(value) {
            if (!value) return '';
            const [year, month, day] = value.split('-').map(Number);
            const months = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];
            return `${day}${ordinalSuffix(day)} of ${months[month - 1]} ${year}`;
        }

        let holidayIdPendingDelete = null;

        function deletePublicHoliday(id) {
            holidayIdPendingDelete = id;
            const modal = document.getElementById('deleteHolidayModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDeleteHolidayModal() {
            holidayIdPendingDelete = null;
            const modal = document.getElementById('deleteHolidayModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function confirmDeleteHoliday() {
            if (holidayIdPendingDelete == null) {
                return;
            }
            const id = holidayIdPendingDelete;
            closeDeleteHolidayModal();
            try {
                const res = await fetch(`/leave/holidays/${id}`, { method: 'DELETE' });
                if (!res.ok) {
                    throw new Error(await res.text() || 'Failed to remove holiday.');
                }
                await loadPublicHolidays();
            } catch (e) {
                alert(e.message);
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            await loadMyLeaveRequests();
            await loadPendingApprovals();
            await loadPublicHolidays();
        });
    </script>

</main>
</body>
</html>
