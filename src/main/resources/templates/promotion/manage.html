<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${promotionLayout}}">
<head>
    <title>Promotion Management</title>
    <th:block th:replace="~{promotion/main :: promotionStyles}"></th:block>
</head>
<body>
<main layout:fragment="content" th:attr="data-initial-section=${initialSection},data-promotion-role=${promotionRole}">
    <th:block th:replace="~{promotion/main :: promotionNavigation}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionMessage}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionDashboard}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionRequestToolbar}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionReports}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionPayrollHandoffs}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionFormPanel}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionConfiguration}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionTasks}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionRequests}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionDetail}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionActionModal}"></th:block>
    <th:block th:replace="~{promotion/main :: promotionScripts}"></th:block>
</main>
</body>
</html>
