
name: build-JustHumanResource

on:
  push:
    branches:
      - qa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install glibc
        run: sudo apt-get update && sudo apt-get install -y libc6

  build-image:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      
      - name: Build and Push with Jib
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          echo "Building image: kazeemakinrinde/justhumanresourceqa:${IMAGE_TAG}"

          mvn -B clean package jib:build \
            -DskipTests \
            -Djib.to.image=kazeemakinrinde/justhumanresourceqa:${IMAGE_TAG} \
            -Djib.to.auth.username=${{ secrets.DOCKER_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKER_PASSWORD }}

  
  deploy:
    name: Deploy to Coolify on Contabo
    runs-on: ubuntu-latest
    needs: build-image
  
    steps:
      - name: Update Coolify image tag
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID_QA: ${{ secrets.COOLIFY_APP_UUID_QA }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
  
          curl --fail-with-body --show-error --silent \
            --request PATCH \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID" \
            --data "{\"docker_registry_image_tag\":\"$IMAGE_TAG\"}"
  
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_QA }}
        run: |
          set -euo pipefail
  
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID_QA&force=true"
